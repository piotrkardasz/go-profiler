version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: profiler
      POSTGRES_PASSWORD: profiler
      POSTGRES_DB: profiler_demo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profiler"]
      interval: 2s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ../..
      dockerfile: examples/gorm-postgres/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "host=postgres user=profiler password=profiler dbname=profiler_demo port=5432 sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
